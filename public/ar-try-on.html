<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>AR Try-On | Surya Jewellers</title>

  <!-- MindAR face tracking + A-Frame (order matters) -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ── Loading screen ── */
    #loading {
      position: fixed; inset: 0; z-index: 200;
      background: #0a0a0a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 44px; height: 44px;
      border: 2px solid #c9a84c33;
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .load-title {
      color: #c9a84c;
      font-size: 13px;
      letter-spacing: 3px;
      text-align: center;
    }
    .load-subtitle {
      color: #ffffff44;
      font-size: 11px;
      letter-spacing: 1px;
    }

    /* ── Error screen ── */
    #error-screen {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: #0a0a0a;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; padding: 32px;
    }
    #error-screen.visible { display: flex; }
    .error-icon { font-size: 48px; }
    .error-msg { color: #ef4444; font-size: 14px; text-align: center; line-height: 1.6; max-width: 300px; }
    .gold-btn {
      padding: 14px 28px;
      background: #c9a84c;
      color: #000;
      border: none;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* ── A-Frame scene ── */
    a-scene {
      position: fixed; inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── UI overlay ── */
    #ui-overlay {
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none;
    }

    /* Ring name banner */
    #ring-name-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
    }
    .ring-name-text {
      color: #c9a84c;
      font-size: 12px;
      letter-spacing: 3px;
      text-align: center;
    }

    /* Close button */
    #close-btn {
      pointer-events: all;
      position: absolute;
      top: 14px; left: 16px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      border: 1px solid #c9a84c99;
      color: #c9a84c;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }

    /* Instructions */
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.5);
      border: 1px solid #c9a84c44;
      padding: 12px 20px;
      text-align: center;
      transition: opacity 0.5s ease;
    }
    #instructions.fade-out { opacity: 0; pointer-events: none; }
    #instructions p {
      color: #c9a84c;
      font-size: 12px;
      letter-spacing: 2px;
    }
    #instructions small {
      color: #ffffff66;
      font-size: 10px;
      display: block;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Capture button */
    #capture-btn {
      pointer-events: all;
      position: absolute;
      bottom: 48px;
      left: 50%; transform: translateX(-50%);
      padding: 16px 40px;
      background: #c9a84c;
      color: #000;
      border: none;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      white-space: nowrap;
    }
    #capture-btn:active { opacity: 0.8; }

    /* Flash effect on capture */
    #flash {
      position: fixed; inset: 0; z-index: 300;
      background: #fff;
      opacity: 0; pointer-events: none;
      transition: opacity 0.15s ease;
    }
    #flash.active { opacity: 0.7; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Flash overlay -->
  <div id="flash"></div>

  <!-- Loading screen -->
  <div id="loading">
    <div class="spinner"></div>
    <p class="load-title">✦ Preparing your try-on experience...</p>
    <p class="load-subtitle">Initialising AR camera</p>
  </div>

  <!-- Error screen -->
  <div id="error-screen">
    <div class="error-icon">💍</div>
    <p class="error-msg" id="error-msg">Could not start AR. Please allow camera access and try again.</p>
    <button class="gold-btn" onclick="window.location.reload()">Try Again</button>
    <button class="gold-btn" style="background:transparent;color:#c9a84c;border:1px solid #c9a84c;margin-top:4px" onclick="goBack()">← Back</button>
  </div>

  <!-- AR Scene (MindAR face tracking) -->
  <a-scene
    id="ar-scene"
    mindar-face="autoStart: false; uiLoading: no; uiError: no; uiScanning: no"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <img id="ring-img" crossorigin="anonymous" />
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>

    <!--
      Anchor 152 = chin tip.
      Ring is placed slightly in front of the chin so the user can
      hold their hand up near chin level and align their finger with the ring.
    -->
    <a-entity mindar-face-target="anchorIndex: 152">
      <a-image
        id="ar-ring"
        src="#ring-img"
        width="0.18"
        height="0.18"
        position="0 -0.12 0.01"
        transparent="true"
        alpha-test="0.05"
        side="double">
      </a-image>
    </a-entity>

  </a-scene>

  <!-- UI overlay (hidden until AR starts) -->
  <div id="ui-overlay" style="display:none">
    <!-- Ring name bar -->
    <div id="ring-name-bar">
      <p class="ring-name-text" id="ring-name-display">SURYA JEWELLERS</p>
    </div>

    <!-- Close -->
    <button id="close-btn" onclick="goBack()" title="Close">✕</button>

    <!-- Instructions (fades after a few seconds) -->
    <div id="instructions">
      <p>✦ Point camera at your hand</p>
      <small>Hold your hand near your chin · align your finger with the ring</small>
    </div>

    <!-- Capture -->
    <button id="capture-btn" onclick="capturePhoto()">📸 Capture</button>
  </div>

  <script>
    /* ── URL params ── */
    const params  = new URLSearchParams(window.location.search);
    const imgUrl  = params.get('img')  || '';
    const name    = params.get('name') || 'Surya Jewellers Ring';
    const backUrl = params.get('back') || '/products';

    function goBack() {
      try { window.history.back(); } catch(e) { window.location.href = backUrl; }
    }

    /* ── Set ring image + name ── */
    const ringImg = document.getElementById('ring-img');
    ringImg.src = imgUrl;

    document.getElementById('ring-name-display').textContent =
      '✦  ' + name.toUpperCase() + '  ✦';

    /* ── Hide instructions after 5 s ── */
    function hideInstructions() {
      setTimeout(() => {
        const el = document.getElementById('instructions');
        if (el) { el.classList.add('fade-out'); }
      }, 5000);
    }

    /* ── Capture photo ── */
    function capturePhoto() {
      // Flash effect
      const flash = document.getElementById('flash');
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 300);

      // Grab the A-Frame WebGL canvas
      const scene = document.getElementById('ar-scene');
      const glCanvas = scene.querySelector('canvas');
      if (!glCanvas) { alert('Could not capture. Please try again.'); return; }

      // We need to render one more frame first, then grab
      requestAnimationFrame(() => {
        try {
          const dataUrl = glCanvas.toDataURL('image/jpeg', 0.92);
          const a = document.createElement('a');
          a.download = 'surya-jewellers-try-on.jpg';
          a.href = dataUrl;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch (e) {
          // Cross-origin canvas taint — fall back to html2canvas-like approach
          console.warn('Canvas tainted, trying video snapshot', e);
          captureFromVideo();
        }
      });
    }

    /* Fallback: composite video + ring image on a 2d canvas */
    function captureFromVideo() {
      const video = document.querySelector('video');
      if (!video) return;

      const W = video.videoWidth  || video.clientWidth;
      const H = video.videoHeight || video.clientHeight;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');

      // Mirror if front cam
      ctx.translate(W, 0); ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, W, H);
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // Overlay ring image centred
      if (imgUrl) {
        const ringEl = new Image();
        ringEl.crossOrigin = 'anonymous';
        ringEl.onload = () => {
          const rSize = Math.min(W, H) * 0.22;
          ctx.drawImage(ringEl, (W - rSize) / 2, (H - rSize) / 2 + H * 0.12, rSize, rSize);
          const a = document.createElement('a');
          a.download = 'surya-jewellers-try-on.jpg';
          a.href = c.toDataURL('image/jpeg', 0.92);
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };
        ringEl.onerror = () => {
          const a = document.createElement('a');
          a.download = 'surya-jewellers-try-on.jpg';
          a.href = c.toDataURL('image/jpeg', 0.92);
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };
        ringEl.src = imgUrl;
      }
    }

    /* ── Start AR ── */
    const scene = document.getElementById('ar-scene');

    scene.addEventListener('loaded', async () => {
      const arSystem = scene.systems['mindar-face-system'];
      if (!arSystem) {
        showError('MindAR system not found. Please refresh and allow camera access.');
        return;
      }

      try {
        await arSystem.start();

        // Hide loading
        const loading = document.getElementById('loading');
        loading.classList.add('hidden');
        setTimeout(() => { loading.style.display = 'none'; }, 700);

        // Show UI
        document.getElementById('ui-overlay').style.display = 'block';
        hideInstructions();

      } catch (err) {
        console.error('MindAR start error:', err);
        showError(
          err && err.message
            ? err.message
            : 'Camera access denied. Please allow camera permissions and reload.'
        );
      }
    });

    scene.addEventListener('arError', (e) => {
      showError('AR initialisation failed. Please try again.');
    });

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('error-screen').classList.add('visible');
    }

    /* ── iOS Safari camera permission hint ── */
    // iOS 13+ requires a user gesture before requesting camera
    // A-Frame / MindAR handles this automatically via getUserMedia inside arSystem.start()
  </script>
</body>
</html>
