<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Virtual Try On - Surya Jewellers</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Cinzel', serif; }
    #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          pointer-events: none; z-index: 999; }
    #close-btn {
      position: fixed; top: 20px; left: 20px;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,0,0,0.6); border: 1px solid #c9a84c;
      color: #c9a84c; font-size: 20px; cursor: pointer;
      pointer-events: all; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    #hint {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: #c9a84c; font-size: 13px; letter-spacing: 2px;
      background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px;
      pointer-events: none; z-index: 1000; white-space: nowrap;
    }
    #capture-btn {
      position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
      width: 70px; height: 70px; border-radius: 50%;
      background: #c9a84c; border: 3px solid #fff;
      cursor: pointer; pointer-events: all; z-index: 1000;
    }
    #capture-btn::after {
      content: ''; display: block;
      width: 54px; height: 54px; border-radius: 50%;
      background: #c9a84c; border: 2px solid rgba(255,255,255,0.5);
      margin: 5px auto;
    }
    #loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: #c9a84c; font-size: 14px; letter-spacing: 3px; text-align: center;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="loading">✦ LOADING TRY ON...</div>

  <button id="close-btn" onclick="window.history.back()">✕</button>
  <div id="hint">POINT CAMERA AT YOUR HAND</div>
  <button id="capture-btn" onclick="capturePhoto()"></button>

  <a-scene id="scene"
    mindar-image="imageTargetSrc: /targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="width:100vw; height:100vh;">
    <a-assets>
      <img id="ring-img" crossorigin="anonymous"/>
    </a-assets>
    <a-camera></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
      <a-image src="#ring-img" position="0 0 0" width="0.5" height="0.5"></a-image>
    </a-entity>
  </a-scene>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ringImg = params.get('img');
    if (ringImg) {
      document.getElementById('ring-img').src = decodeURIComponent(ringImg);
    }

    const scene = document.getElementById('scene');
    scene.addEventListener('loaded', () => {
      document.getElementById('loading').style.display = 'none';
    });

    function capturePhoto() {
      const canvas = document.querySelector('canvas');
      if (!canvas) return;
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'surya-jewellers-tryon.jpg';
        a.click();
      }, 'image/jpeg', 0.9);
    }
  </script>
</body>
</html>
